##########################################################################
#  vexch.ini — 가상거래소(Virtual Exchange) 상품 카탈로그
#
#  가상거래소가 이 카탈로그를 읽어 상품별 주문/응답/체결 전문을 생성한다.
#  ▶ 상품 추가 = [PRODUCT_*] 블록 1개 추가 (엔진 재빌드 불요).
#
#  필드:
#    market      : 시장 letter (b=채권, c=파생, a=현물, f=FX)
#    order_tr    : 주문 전문 TrCode (거래소가 수신, 송신소켓)
#    order_size  : 주문 전문 body 바이트 (TCHODR: 채권254 / 현·파294)
#    resp_tr     : 회원처리호가(응답) TrCode (거래소가 push, 수신소켓)
#    resp_size   : 응답 payload 바이트
#    exec_tr     : 회원체결결과(체결) TrCode (거래소가 push)
#    exec_size   : 체결 payload 바이트
#    wrapper     : push 래퍼 MsgType (KRX 수신 전문 래퍼, 보통 TCHTDP00000)
#    fill_rule   : ack(응답만) | full(전량체결) | partial(부분) | reject(거부)
#    enabled     : Y/N (거래소 기동 시 이 상품 활성)
#  ── FX 거래원 주문(VX-4) 필드 (선택; order_proto=fx_smb 상품만) ──
#    order_proto : krx(기본, TCHODR TCP) | fx_smb(SMB_ST/FIX-flat TCP 1024B)
#    fx_excode   : FX 거래원 코드 1자 (J JPM/N NH/E EBS/C CMB/B BEST/Z CUST)
#    fx_port     : 가상 FX 거래원 엔진 TCP 포트
#  ── 시세(VX-2) 필드 (선택; 시세 발행 대상 상품만) ──
#    sise_kind   : none | fx(CO_B6FX UDP) | krx(TrCode prefix+body UDP)
#    sise_ip     : 시세 발행 대상 IP (수신 프로세스 bind 주소)
#    sise_port   : 시세 UDP 포트
#    sise_tr     : KRX 시세 TrCode prefix (A301F/G701F/B601F/R101F) — krx 전용
#    sise_size   : KRX 시세 전문 바이트 — krx 전용
#    sise_symbol : FX 심볼(root) — fx 전용
#    sise_excode : FX 거래소코드 1자 — fx 전용
##########################################################################

[PRODUCT_DERIV]
market=c
order_tr=TCHODR10001
order_size=294
resp_tr=TTRODP11301
resp_size=294
exec_tr=TTRTDP21301
exec_size=209
wrapper=TCHTDP00000
fill_rule=full
enabled=Y
sise_kind=krx
sise_ip=239.1.1.1
sise_port=17001
sise_tr=A301F
sise_size=173

[PRODUCT_BOND]
market=b
order_tr=TCHODR40001
order_size=254
resp_tr=TTRODP41301
resp_size=294
exec_tr=TTRTDP42301
exec_size=233
wrapper=TCHTDP00000
fill_rule=full
enabled=Y

[PRODUCT_FX_USDKRW]
market=f
fill_rule=full
enabled=Y
order_proto=fx_smb
fx_excode=J
fx_port=19100
sise_kind=fx
sise_ip=127.0.0.1
sise_port=18400
sise_symbol=USDKRW
sise_excode=J

[PRODUCT_FX_NH]
market=f
fill_rule=full
enabled=Y
order_proto=fx_smb
fx_excode=N
fx_port=19101

[PRODUCT_FX_EBS]
market=f

# 각 필드는 strtok로 불러오기 때문에 데이타가 없는 필드라도 
#  구분자(:) 사이에 스페이스(' ')나 도트('.')가 꼭 있어야 한다.
# field number
# field name
# x position
# y position
# view size
# data size : malloc 되는 size
# attribute 
#		    unsigned char   blink:2; 
#		    unsigned char   crossed:1;
#		    unsigned char   conceal:1;
#		    unsigned char   underline:1;
#		    unsigned char   italic:1;
#		    unsigned char   bold:1;
#		    unsigned char   reverse:1;
#		    unsigned char   :8;
#		    unsigned char   :8;
#		    unsigned char   fore:4;          
#		    unsigned char   back:4;
#           	color - fore, back
#					WIN_ATTR_BLACK              0x0    전체 attr field가 0이면 default color 적용(black 적용 안됨)
#					WIN_ATTR_RED                0x1
#					WIN_ATTR_GREEN              0x2
#					WIN_ATTR_YELLO              0x3
#					WIN_ATTR_BLUE               0x4
#					WIN_ATTR_MAGENTA            0x5
#					WIN_ATTR_CYAN               0x6
#					WIN_ATTR_WHITE              0x7
#					WIN_ATTR_BRIGHT             0x8
# type : field type

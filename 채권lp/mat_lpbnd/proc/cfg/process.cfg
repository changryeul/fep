daily_name		= "clear"									# daily clear process name id
interval		= 1000000									# daemon process check 간격 - micro second 
mon_interval	= 3000000									# mon usleep time
log_file_name	= "$log_path/proc_daemon.YYYYMMDD.log"		# YYYYMMDDhhmmss
swap_log_name	= "$log_path/proc_swap.log"

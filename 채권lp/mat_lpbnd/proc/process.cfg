###################################################################################################################
# 각 필드는 strtok로 불러오기 때문에 데이타가 없는 필드라도 
#  구분자(:) 사이에 스페이스(' ')나 도트('.')가 꼭 있어야 한다.
# field number
# field name
# x position
# y position
# view size
# data size : malloc 되는 size
# attribute 
#		    unsigned char   blink:2; 
#		    unsigned char   crossed:1;
#		    unsigned char   conceal:1;
#		    unsigned char   underline:1;
#		    unsigned char   italic:1;
#		    unsigned char   bold:1;
#		    unsigned char   reverse:1;
#		    unsigned char   :8;
#		    unsigned char   :8;
#		    unsigned char   fore:4;          
#		    unsigned char   back:4;
#           	color - fore, back
#					WIN_ATTR_BLACK              0x0    전체 attr field가 0이면 default color 적용(black 적용 안됨)
#					WIN_ATTR_RED                0x1
#					WIN_ATTR_GREEN              0x2
#					WIN_ATTR_YELLO              0x3
#					WIN_ATTR_BLUE               0x4
#					WIN_ATTR_MAGENTA            0x5
#					WIN_ATTR_CYAN               0x6
#					WIN_ATTR_WHITE              0x7
#					WIN_ATTR_BRIGHT             0x8
# type : field type
#			    unsigned char           byte4:8;
#			    unsigned char           byte3:8;
#			    unsigned char           map:1;		/* only display at Map_DisplayMap */
#			    unsigned char           byte2:7;
#			    unsigned char           type:4;		/* 0:char 1:int 2:float 3:long 4:long long */
#			    unsigned char           pointer:1;
#			    unsigned char           compare:1;
#			    unsigned char           byte1:2;
# format : data를 표시하기위한 printf 포맷
# filler : 모양 맞추기 위한 field ...
# initial data
#
#
#	"base	:name		:pos_x	:pos_y	:"  - base 아래 필드의 상대 x,y 위치를 세팅: x + pos_x, y + pos_y
#
#	"line	:start		:s_y	:e_y	:"  - 라인 반복 시작 - s_y(start y),e_y(end y) name=name_y
#	"line	:end		:		:		:"  - 라인 반복 끝   
#
#
###################################################################################################################

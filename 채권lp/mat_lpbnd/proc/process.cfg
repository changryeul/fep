##################################################################################################################
# PROCESS CONFIG FILE
##################################################################################################################
# config file
# name = value							# '=' name 변수에 value 값 입력
# name = "this is" 'string'				# string = "", ''로 표시
#										# 개행문자 혹은 comment까지 값으로 인식
# 특수 문자  \a \b \f \n \r \t \v \\ \' \" \? \$ \xHEX \0OCT \DEC \BBIT
# $ - 변수에 저장된 값을 가져온다. ( 1 환경변수,  2 cfg내 선언변수, 3 현재 section 선언변수)
###################################################################################################################
# name1		= value										# comment
# name2		= "this is string"	' continue'				# "string" 'string'
# name3		= "특수문자 \B110010 \x00000032 \062 \50" 	# comment
# name4		= "환경변수 $HOME $name3"					# $환경변수, $변수
# section												# section 
# {
#	s_m1	= sv1 
#	s2		{m1=v1 s3{m2=v2}}							# deep section
# }
# [win_section]											# win section
# win_name1	= win_value1
# Cfg_GetInt string - H(hex) B(bit) O(octal) none(decimal) - ex) Hcdc10001 B000100101 O0231271 0123
###################################################################################################################
pwd				= "$MAT_BIN"
key				= Hfa003001
version			= "PROC FILE TABLE V1.1-20231017"
log_path		= "$MAT_LOG"
cfg_path		= "$MAT_CFG"
swp_path		= "$MAT_DAT/swp"
stdout_file		= "$MAT_LOG/proc_stdout.log"				# child process stdout/stderr
holiday_file	= "$MAT_CFG/holiday.cfg"					# holiday file ... create by mat_bat
daily_name		= "clear"									# daily clear process name id
interval		= 1000000									# daemon process check 간격 - micro second 
mon_interval	= 1000000									# mon usleep time
log_file_name	= "$log_path/proc_d.log"					# YYYYMMDDhhmmss $log_path/proc_d.YYYYMMDD.log
swap_log_name	= "$log_path/proc_swap.log"
swap_file_path	= "$swp_path"								# process table swap file
swap_file_name	= "process.swp"
map_file_name	= "$cfg_path/process.cfg"					# mon - map_file_name
load_config		= 1											# 실시간 config load 여부 1:load 0:not load - 필요할때만 1로 세팅 추천

process_table												# section 
{
#    id               u max start  end    week     path       name                       daemon/batch
#    (trim)           s run time   time   smtwtfsh (trim)     +argument                  d:1 b:0
#                     e cnt               uouehrao
#                     d     HHMMSS HHMMSS nneduitl
# 시스템
	"clear           :1: 99:055800:060000:11111111:$pwd       :proc_d -j                 :0"

# 배치
#	"batch	         :1: 99:070500:073500:01111101:$pwd/shl   :batch_bok_fs.sh           :0"

# 데몬
	"log	         :1: 99:000510:000500:11111111:$pwd       :log_d                     :1"

# 매칭시스템
	"mat_bat		 :1: 99:050000:045900:11111111:$pwd       :mat_bat                   :1"
	"mat_rcv		 :1: 99:080000:040000:01111100:$pwd       :mat_rcv                   :1"
	"mat_ord		 :1: 99:080000:040000:01111100:$pwd       :mat_ord                   :1"
	"mat_mat		 :1: 99:080000:040000:01111100:$pwd       :mat_mat                   :1"
	"mat_exe		 :1: 99:080000:040000:01111100:$pwd       :mat_exe                   :1"
	"mat_snd		 :1: 99:080000:040000:01111100:$pwd       :mat_snd                   :1"
	"mat_sis		 :1: 99:080000:040000:01111100:$pwd       :mat_sis                   :1"

	"mat_ma1		 :1: 99:080000:040000:01111100:$pwd       :mat_mat                   :1"
	"mat_ma2		 :1: 99:080000:040000:01111100:$pwd       :mat_mat                   :1"
	"mat_ma3		 :0: 99:080000:040000:01111100:$pwd       :mat_mat                   :1"
	"mat_ma4		 :0: 99:080000:040000:01111100:$pwd       :mat_mat                   :1"

	"mat_ex1		 :1: 99:080000:040000:01111100:$pwd       :mat_exe                   :1"
	"mat_ex2		 :1: 99:080000:040000:01111100:$pwd       :mat_exe                   :1"
	"mat_ex3		 :0: 99:080000:040000:01111100:$pwd       :mat_exe                   :1"

# EBS CME fix recv system
#	"fix_BOC		 :1: 99:065950:055000:01111101:$pwd/bin   :fix_recv -i FIXEBS_BOC    :1"

# psf system
#	"psf_p_M_BLB_FS2 :1: 99:070500:020500:01111101:$pwd/bin   :psf_proc -i M_BLB_FS2  :1"
}


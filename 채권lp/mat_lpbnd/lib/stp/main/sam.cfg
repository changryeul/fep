##################################################################################################################
# TEST CONFIG FILE
##################################################################################################################
# config file
# name = value							# '=' name 변수에 value 값 입력
# name = "this is" 'string'				# string = "", ''로 표시
#										# 개행문자 혹은 comment까지 값으로 인식
# 특수 문자  \a \b \f \n \r \t \v \\ \' \" \? \$ \xHEX \0OCT \DEC \BBIT
# $ - 변수에 저장된 값을 가져온다. ( 1 환경변수,  2 cfg내 선언변수, 3 현재 section 선언변수)
###################################################################################################################
# name1		= value										# comment
# name2		= "this is string"	' continue'				# "string" 'string'
# name3		= "특수문자 \B110010 \x00000032 \062 \50" 	# comment
# name4		= "환경변수 $HOME $name3"					# $환경변수, $변수
# section												# section 
# {
#	s_m1	= sv1 
#	s2		{m1=v1 s3{m2=v2}}							# deep section
# }
# [win_section]											# win section
# win_name1	= win_value1
# Cfg_GetInt string - H(hex) B(bit) O(octal) none(decimal) - ex) Hcdc10001 B000100101 O0231271 0123
###################################################################################################################
pwd				= "$HOME/cdc/lib/sam"
interval		= 10										# 공유메모리를 swap 파일로 저장하는 간격 - 초단위 
log_file_name	= "$pwd/sam_process.log"
swap_file_name	= "$pwd/sam.swp"
sam_file_path	= "$pwd/test"								# sam file path
bak_file_path	= "$pwd/test/backup"						# sam file backup path
load_config		= 1											# config load 여부 1:load 0:not load - config 파일을 고칠때
															#   0으로 세팅해 놓으면 실시간으로 공유메모리로 로드 하지 않는다

sam_table													# section 
{
#    id          t sem        name         record  delimiter
#    (trim)      y key        (trim)       length
#                p                                           
#                e      
	"KMB_TEST   :0:0xfe010101:KMB_TEST    :1024   :0x0a000000:"
	"KMB_TYPE1  :1:0xfe010102:KMB_TYPE1   :1024   :0x0a000000:"
	"KMB_TYPE2  :2:0xfe010103:KMB_TYPE2   :1024   :0x0a000000:"
	"KMB_TYPE3  :3:0xfe010104:KMB_TYPE3   :1024   :0x0a000000:"
}





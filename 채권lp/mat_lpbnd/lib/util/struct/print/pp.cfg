###############################################################################
# config file
# name = value							# name 변수에 value 값 입력
#										# value 공백 및 탭 무시 - 공백이나 탭을 값으로 입력 하려면 "", ''로 표시
#										# 개행문자 혹은 comment까지 값으로 인식
###############################################################################
server_num			= 1					# SBRS=1 TBRS=2

alarm				= 0					# 0=off 1=on
start_interval		= 300				# 모니터 시작 log display 간격 (단위:초)
cur_time_over		= 1					# current time over check



SBRS_LOG_DATA
{
#	func = "line:column:length:flag:string, ..."
#		func	액션을 수행할 함수
#		line 	현재라인:0 이전라인:1 전전라인:2 ...
#		column	비교 시작 위치
#		length	비교할 크기
#		action	0=같으면 무시, 1=같으면 계속, 2=데이터 get, 3=string set
#		string	비교할 문자열
#       :       필드 구분자
}





